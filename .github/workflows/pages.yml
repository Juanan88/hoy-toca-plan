name: Publicar Hoy Toca Plan
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hoy-toca-plan-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar web pública
        uses: actions/checkout@v4

      - name: Validar publicación sin código privado
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -f assets/app.js
          test -f assets/site.css
          test ! -d scripts
          test ! -d tests
          test ! -f requirements.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          assert '<title>Hoy Toca Plan' in page, 'Identidad incorrecta'
          required=['events','sources','discoveries','source_suggestions','status','radar_status','verification_status','health']
          for name in required:
              with Path('data', name+'.json').open(encoding='utf-8') as f:
                  content=json.load(f)
              if name=='events':
                  assert isinstance(content,list) and content, 'El catálogo está vacío'
          paths={str(p.as_posix()) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          static_paths={'index.html','.nojekyll','assets/app.js','assets/site.css'}
          static_paths|={f'data/{name}.json' for name in required}
          public_extra={'README.md','.github/workflows/pages.yml'}
          assert paths<=static_paths|public_extra, 'Hay archivos no permitidos en el repositorio público: '+repr(paths-(static_paths|public_extra))
          print('WEB OK ·',len(json.loads(Path('data/events.json').read_text(encoding='utf-8'))),'actividades · sin rastreadores')
          PY

      - name: Empaquetar solo archivos públicos
        shell: bash
        run: |
          mkdir -p public/assets public/data
          cp index.html .nojekyll public/
          cp assets/app.js assets/site.css public/assets/
          for file in events sources discoveries source_suggestions status radar_status verification_status health; do
            cp "data/$file.json" public/data/
          done

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Crear artefacto de publicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
